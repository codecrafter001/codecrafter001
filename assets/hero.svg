<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="208" rx="10"/>
    </clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#7B2CBF" stroke-width="0.5"/>
    </pattern>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="0" y="0" width="0" height="24" y="60">
        <animate attributeName="width" from="0" to="230" dur="1.1s" begin="0.3s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background card -->
  <rect x="1" y="1" width="898" height="208" rx="10" fill="#07050c" stroke="#7B2CBF" stroke-opacity="0.5" stroke-width="1.2"/>

  <g clip-path="url(#cardClip)">
    <!-- ambient glow -->
    <circle cx="820" cy="40" r="90" fill="#9D4EDD" opacity="0.14" filter="url(#softBlur)">
      <animate attributeName="r" values="80;104;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.18;0.10" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- subtle grid -->
    <rect x="0" y="0" width="900" height="210" fill="url(#grid)" opacity="0.07"/>

    <!-- floating particles -->
    <circle cx="680" cy="55" r="1.8" fill="#E0AAFF" opacity="0.45">
      <animate attributeName="cy" values="55;46;55" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="95" r="1.5" fill="#C77DFF" opacity="0.4">
      <animate attributeName="cy" values="95;105;95" dur="5.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="825" cy="140" r="1.8" fill="#9D4EDD" opacity="0.4">
      <animate attributeName="cy" values="140;131;140" dur="4.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="160" r="1.4" fill="#E0AAFF" opacity="0.35">
      <animate attributeName="cy" values="160;169;160" dur="5.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status bar -->
  <circle cx="28" cy="28" r="5" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="33" font-family="Consolas, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#8CFFB0">SYSTEM ONLINE</text>
  <text x="872" y="33" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="12" fill="#9D4EDD" opacity="0.85">AI_CORE v2.0</text>
  <line x1="1" y1="48" x2="899" y2="48" stroke="#7B2CBF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- command line with typing reveal -->
  <g clip-path="url(#typeClip)">
    <text x="32" y="76" font-family="Consolas, Menlo, monospace" font-size="15" fill="#C77DFF">&gt; initialize_rashi()</text>
  </g>
  <rect x="252" y="63" width="8" height="16" fill="#C77DFF">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.5s" fill="freeze"/>
    <text x="32" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F3E8FF">Hi, I'm Rashi 👋</text>
  </g>

  <!-- role -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.9s" fill="freeze"/>
    <text x="32" y="140" font-family="Consolas, Menlo, monospace" font-size="14" fill="#C77DFF">AI/ML Engineer • Full-Stack Developer • Agentic AI Builder</text>
  </g>

  <!-- tagline -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="2.3s" fill="freeze"/>
    <text x="32" y="160" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#A991C9">Building intelligent systems, AI agents &amp; next-gen products.</text>
  </g>

  <!-- system tag pills -->
  <g font-family="Consolas, Menlo, monospace" font-size="10.5" letter-spacing="0.5">
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.6s" fill="freeze"/>
      <rect x="32" y="174" width="94" height="22" rx="4" fill="none" stroke="#7B2CBF">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="79" y="188.5" text-anchor="middle" fill="#C77DFF">AI SYSTEMS</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.75s" fill="freeze"/>
      <rect x="136" y="174" width="60" height="22" rx="4" fill="none" stroke="#7B2CBF">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="0.2s" repeatCount="indefinite"/>
      </rect>
      <text x="166" y="188.5" text-anchor="middle" fill="#C77DFF">LLMs</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.9s" fill="freeze"/>
      <rect x="206" y="174" width="100" height="22" rx="4" fill="none" stroke="#7B2CBF">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <text x="256" y="188.5" text-anchor="middle" fill="#C77DFF">AGENTIC AI</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.05s" fill="freeze"/>
      <rect x="316" y="174" width="88" height="22" rx="4" fill="none" stroke="#7B2CBF">
        <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="360" y="188.5" text-anchor="middle" fill="#C77DFF">FULL-STACK</text>
    </g>
  </g>
</svg>
