<svg width="1000" height="290" viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#150c28"/>
      <stop offset="100%" stop-color="#07050d"/>
    </radialGradient>
    <linearGradient id="rashiGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="55%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#7B2CBF" stroke-width="0.5"/>
    </pattern>
    <filter id="glowBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="typeClip">
      <rect x="40" y="58" width="0" height="66">
        <animate attributeName="width" from="0" to="330" dur="1.1s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="290" fill="url(#bgGlow)"/>
  <rect x="0" y="0" width="1000" height="290" fill="url(#grid)" opacity="0.07">
    <animate attributeName="opacity" values="0.05;0.09;0.05" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ambient purple glow behind heading -->
  <circle cx="260" cy="120" r="160" fill="#8B5CF6" opacity="0.10" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.08;0.14;0.08" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <circle cx="700" cy="45" r="1.6" fill="#E0AAFF" opacity="0.45"><animate attributeName="cy" values="45;36;45" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="90" r="1.4" fill="#C77DFF" opacity="0.4"><animate attributeName="cy" values="90;99;90" dur="5.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="60" r="1.8" fill="#9D4EDD" opacity="0.4"><animate attributeName="cy" values="60;51;60" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="920" cy="120" r="1.4" fill="#E0AAFF" opacity="0.35"><animate attributeName="cy" values="120;129;120" dur="5.3s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="150" r="1.6" fill="#C77DFF" opacity="0.35"><animate attributeName="cy" values="150;142;150" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="170" r="1.4" fill="#9D4EDD" opacity="0.3"><animate attributeName="cy" values="170;178;170" dur="5.4s" begin="0.6s" repeatCount="indefinite"/></circle>

  <!-- occasional neural connections -->
  <line x1="700" y1="45" x2="780" y2="90" stroke="#C77DFF" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" values="0;0.22;0" dur="8s" begin="1s" repeatCount="indefinite"/>
  </line>
  <line x1="860" y1="60" x2="920" y2="120" stroke="#9D4EDD" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" values="0;0.2;0" dur="9s" begin="3s" repeatCount="indefinite"/>
  </line>
  <line x1="780" y1="90" x2="740" y2="150" stroke="#E0AAFF" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" values="0;0.18;0" dur="7.5s" begin="5s" repeatCount="indefinite"/>
  </line>

  <!-- "Hey there," -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.1s" fill="freeze"/>
    <text x="40" y="42" font-family="Consolas, Menlo, monospace" font-size="19" fill="#D9D4E8">Hey there,</text>
  </g>

  <!-- "Rashi" ambient glow duplicate (behind crisp text) -->
  <text x="174" y="110" font-family="Consolas, Menlo, monospace" font-size="56" font-weight="700" fill="url(#rashiGradient)" filter="url(#glowBlur)" opacity="0">
    <animate attributeName="opacity" values="0.25;0.45;0.25" dur="4s" begin="1.7s" repeatCount="indefinite"/>
    Rashi
  </text>

  <!-- "I'm Rashi" typing reveal -->
  <g clip-path="url(#typeClip)">
    <text x="40" y="110" font-family="Consolas, Menlo, monospace" font-size="56" font-weight="700"><tspan fill="#FFFFFF">I'm </tspan><tspan fill="url(#rashiGradient)">Rashi</tspan></text>
  </g>
  <rect x="346" y="64" width="9" height="50" fill="#F472B6">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.6s" repeatCount="indefinite"/>
  </rect>

  <!-- role line, sequential reveal -->
  <g font-family="Consolas, Menlo, monospace" font-size="14" letter-spacing="2" fill="#C77DFF">
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.0s" fill="freeze"/>
      <text x="40" y="152">AI/ML ENGINEER</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.15s" fill="freeze"/>
      <text x="178" y="152">•</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.3s" fill="freeze"/>
      <text x="198" y="152">FULL-STACK DEVELOPER</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.55s" fill="freeze"/>
      <text x="376" y="152">•</text></g>
    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.7s" fill="freeze"/>
      <text x="396" y="152">AGENTIC AI BUILDER</text></g>
  </g>

  <!-- tagline -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="3.0s" fill="freeze"/>
    <text x="40" y="188" font-family="Consolas, Menlo, monospace" font-size="15">
      <tspan fill="#FFFFFF">Building </tspan><tspan fill="#C77DFF" font-weight="700">intelligent systems</tspan><tspan fill="#FFFFFF">, AI agents &amp; next-gen products.</tspan>
    </text>
  </g>

  <!-- info cards -->
  <g font-family="Consolas, Menlo, monospace">
    <!-- B.Tech -->
    <g opacity="0" transform="translate(0,10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="3.3s" fill="freeze"/>
      <rect x="40" y="216" width="152" height="54" rx="14" fill="#0d0918" stroke="#7B2CBF" stroke-opacity="0.55" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="4s" begin="4.2s" repeatCount="indefinite"/>
      </rect>
      <text x="58" y="238" font-size="16" fill="#C77DFF">🎓</text>
      <text x="82" y="238" font-size="12.5" font-weight="700" fill="#F5F0FF">B.Tech</text>
      <text x="58" y="256" font-size="11" fill="#9A8FB5">AI &amp; Data Science</text>
    </g>

    <!-- India -->
    <g opacity="0" transform="translate(0,10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="3.5s" fill="freeze"/>
      <rect x="204" y="216" width="104" height="54" rx="14" fill="#0d0918" stroke="#7B2CBF" stroke-opacity="0.55" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="4s" begin="4.4s" repeatCount="indefinite"/>
      </rect>
      <text x="222" y="248" font-size="16" fill="#C77DFF">📍</text>
      <text x="246" y="248" font-size="12.5" font-weight="700" fill="#F5F0FF">India</text>
    </g>

    <!-- Full-Stack Development -->
    <g opacity="0" transform="translate(0,10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.7s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="3.7s" fill="freeze"/>
      <rect x="328" y="216" width="158" height="54" rx="14" fill="#0d0918" stroke="#7B2CBF" stroke-opacity="0.55" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="4s" begin="4.6s" repeatCount="indefinite"/>
      </rect>
      <text x="346" y="238" font-size="14" fill="#C77DFF">&lt;/&gt;</text>
      <text x="378" y="238" font-size="12.5" font-weight="700" fill="#F5F0FF">Full-Stack</text>
      <text x="346" y="256" font-size="11" fill="#9A8FB5">Development</text>
    </g>

    <!-- AI/ML & Agentic AI -->
    <g opacity="0" transform="translate(0,10)">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.9s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="0.5s" begin="3.9s" fill="freeze"/>
      <rect x="502" y="216" width="150" height="54" rx="14" fill="#0d0918" stroke="#7B2CBF" stroke-opacity="0.55" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.4;0.7;0.4" dur="4s" begin="4.8s" repeatCount="indefinite"/>
      </rect>
      <text x="520" y="238" font-size="16" fill="#C77DFF">🧠</text>
      <text x="544" y="238" font-size="12.5" font-weight="700" fill="#F5F0FF">AI/ML &amp;</text>
      <text x="520" y="256" font-size="11" fill="#9A8FB5">Agentic AI</text>
    </g>
  </g>
</svg>
